<!doctype html>

<style>

  .card h3{font-family:'Playfair Display',serif;font-weight:500;font-size:17px;color:#2D2D2D;margin:14px 0 2px;}
  .card p{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#C9A96E;margin:0;font-weight:500;}
</style>
